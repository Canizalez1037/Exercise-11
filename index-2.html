<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Years of Service</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 100%;
            width: 80%;
            max-width: 1000px;
            margin: 1.5em auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid black;
        }

        caption {
            font-size: 1.5em;
            font-weight: bold;
            text-align: center;
            padding: .6em;
        }

        thead { background-color: lightgreen; }

        th, td {
            border: 1px solid black;
            padding: .6em .75em;
            text-align: left;
            vertical-align: middle;
        }

        th:last-child, td:last-child { text-align: right; }

        tbody tr:nth-child(even) { background-color: lightgrey; }

        /* Under 640px: change the table into vertically stacked records. */
        @media screen and (max-width: 639px) {
            body { width: 94%; margin: 1em auto; }

            table, tbody, tr, td { display: block; width: 100%; }
            table { border: none; }
            thead { display: none; }

            caption {
                display: block;
                font-size: 1.3em;
                padding: .5em 0 .75em;
            }

            tbody tr {
                border: 1px solid black;
                margin-bottom: 1em;
                background: white;
            }

            tbody tr:nth-child(even) { background: lightgrey; }

            tbody td, tbody td:last-child {
                text-align: left;
                border: none;
                border-bottom: 1px solid #aaa;
                padding: .55em .75em;
                overflow-wrap: anywhere;
            }

            tbody td:last-child { border-bottom: none; }

            tbody td::before {
                content: attr(data-label);
                display: block;
                font-weight: bold;
                margin-bottom: .2em;
            }
        }
    </style>
</head>
<body>
    <table>
        <caption>Employee Years of Service</caption>
        <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">E-mail</th>
                <th scope="col">Years of Service</th>
            </tr>
        </thead>
        <tbody>
            <tr><td data-label="Name">Joel Murach</td><td data-label="E-mail">joelmurach@yahoo.com</td><td data-label="Years of Service">22</td></tr>
            <tr><td data-label="Name">Anne Boehm</td><td data-label="E-mail">anne@murach.com</td><td data-label="Years of Service">34</td></tr>
            <tr><td data-label="Name">Zak Ruvalcaba</td><td data-label="E-mail">zak@modulemedia.com</td><td data-label="Years of Service">4</td></tr>
            <tr><td data-label="Name">Judy Taylor</td><td data-label="E-mail">judy@murach.com</td><td data-label="Years of Service">39</td></tr>
            <tr><td data-label="Name">Bethany Lee</td><td data-label="E-mail">bethany@murach.com</td><td data-label="Years of Service">10</td></tr>
            <tr><td data-label="Name">Kelly Slivkoff</td><td data-label="E-mail">kelly@murach.com</td><td data-label="Years of Service">25</td></tr>
            <tr><td data-label="Name">Juliette Baylon</td><td data-label="E-mail">juliette@murach.com</td><td data-label="Years of Service">1</td></tr>
        </tbody>
    </table>
</body>
</html>
