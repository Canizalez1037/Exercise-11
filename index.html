<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Table</title>
    <style>
        /* Desktop table styles */
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 100%;
            width: 80%;
            margin: 1em auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid black;
        }

        caption {
            font-size: 1.5em;
            font-weight: bold;
            padding: 0.5em;
            text-align: center;
        }

        thead {
            background-color: lightgreen;
        }

        th, td {
            border: 1px solid black;
            padding: 0.35em 1em 0.35em 0.5em;
            text-align: left;
            vertical-align: middle;
        }

        th:last-child,
        tbody td:last-child {
            text-align: right;
        }

        tbody tr:nth-child(even) {
            background-color: lightgrey;
        }

        /* Narrow-screen layout: each employee becomes a labeled card */
        @media screen and (max-width: 639px) {
            body {
                width: 95%;
            }

            table, tbody, tr, td {
                display: block;
            }

            table {
                width: 100%;
                border: 0;
            }

            thead {
                display: none;
            }

            tbody tr {
                border: 1px solid black;
                margin-bottom: 1em;
                background-color: white;
            }

            tbody tr:nth-child(even) {
                background-color: lightgrey;
            }

            tbody td,
            tbody td:last-child {
                border: 0;
                text-align: left;
                padding: 0.45em 0.75em;
                overflow-wrap: anywhere;
            }

            tbody td::before {
                content: attr(data-label);
                display: block;
                font-weight: bold;
                margin-bottom: 0.2em;
            }
        }
    </style>
</head>
<body>
    <table>
        <caption>Employee Years of Service</caption>
        <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">E-mail</th>
                <th scope="col">Years of Service</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td data-label="Name">Joel Murach</td>
                <td data-label="E-mail">joelmurach@yahoo.com</td>
                <td data-label="Years of Service">22</td>
            </tr>
            <tr>
                <td data-label="Name">Anne Boehm</td>
                <td data-label="E-mail">anne@murach.com</td>
                <td data-label="Years of Service">34</td>
            </tr>
            <tr>
                <td data-label="Name">Zak Ruvalcaba</td>
                <td data-label="E-mail">zak@modulemedia.com</td>
                <td data-label="Years of Service">4</td>
            </tr>
            <tr>
                <td data-label="Name">Judy Taylor</td>
                <td data-label="E-mail">judy@murach.com</td>
                <td data-label="Years of Service">39</td>
            </tr>
            <tr>
                <td data-label="Name">Bethany Lee</td>

                <td data-label="Years of Service">10</td>
            </tr>
            <tr>
                <td data-label="Name">Kelly Slivkoff</td>

        </tbody>
    </table>
</body>
</html>
